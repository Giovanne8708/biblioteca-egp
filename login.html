<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0F172A] min-h-screen flex items-center justify-center font-poppins text-white bg-pattern">
    
    <div class="w-full max-w-md p-6 sm:p-8 mx-4 sm:mx-0 bg-[#1E293B]/80 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-700 glass-effect">
        <div class="text-center mb-8">
            <div class="flex justify-center mb-6">
                <img src="logo.png" alt="Escola de Governo de Pernambuco" class="h-24 object-contain">
            </div>
            <h1 class="text-2xl font-bold text-white">Sistema de Biblioteca</h1>
            <p class="text-slate-400 text-sm mt-2">Acesse o painel de gerenciamento</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Usuário</label>
                <div class="relative">
                    <i class="fa-regular fa-user absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="username" required class="w-full bg-[#0F172A] border border-slate-600 rounded-lg py-3 px-10 text-white focus:outline-none focus:border-[#2563EB] focus:ring-1 focus:ring-[#2563EB] transition-colors">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Senha</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="password" id="password" required class="w-full bg-[#0F172A] border border-slate-600 rounded-lg py-3 px-10 text-white focus:outline-none focus:border-[#2563EB] focus:ring-1 focus:ring-[#2563EB] transition-colors">
                </div>
            </div>
            <button type="submit" class="w-full bg-[#2563EB] hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition-colors shadow-lg shadow-blue-500/25">
                Entrar no Sistema
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            window.location.href = 'index.html'; 
        });
    </script>
</body>
</html>
