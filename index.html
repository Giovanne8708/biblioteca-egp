<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard | Biblioteca EGP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#0F172A] min-h-screen flex font-sans text-slate-200 overflow-hidden">
    
    <!-- HEADER MOBILE (Visível apenas em telas menores) -->
    <header class="md:hidden fixed top-0 left-0 w-full glass z-30 p-4 flex justify-between items-center border-b border-slate-700/50">
        <img src="assets/logo.png?v=2" alt="Logo EGP" class="h-8 object-contain">
        <button id="btn-mobile-menu" class="text-white text-2xl focus:outline-none">
            <i class="fa-solid fa-bars"></i>
        </button>
    </header>

    <!-- SIDEBAR (Menu Lateral) - Responsivo -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 ease-in-out w-64 glass border-r border-slate-700/50 flex flex-col h-screen z-40 bg-[#0F172A] md:bg-transparent">
        <div class="p-6 border-b border-slate-700/50 flex justify-between md:justify-center items-center h-16 md:h-auto mt-16 md:mt-0">
            <img src="assets/logo.png?v=2" alt="Logo EGP" class="h-10 md:h-12 object-contain hidden md:block">
            <button id="btn-close-menu" class="md:hidden text-slate-400 text-2xl absolute top-4 right-4 focus:outline-none">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto py-6 px-4">
            <nav class="space-y-2">
                <a href="#" data-target="dashboard" class="nav-link active text-white bg-slate-800/50 flex items-center px-4 py-3 rounded-xl transition-all">
                    <i class="fa-solid fa-chart-pie w-6"></i> Dashboard
                </a>
                <a href="#" data-target="alunos" class="nav-link text-slate-400 hover:bg-slate-800/50 hover:text-white flex items-center px-4 py-3 rounded-xl transition-all">
                    <i class="fa-solid fa-user-graduate w-6"></i> Alunos
                </a>
                <a href="#" data-target="emprestimos" class="nav-link text-slate-400 hover:bg-slate-800/50 hover:text-white flex items-center px-4 py-3 rounded-xl transition-all">
                    <i class="fa-solid fa-hand-holding-hand w-6"></i> Empréstimos
                </a>
                <a href="#" data-target="configuracoes" class="nav-link text-slate-400 hover:bg-slate-800/50 hover:text-white flex items-center px-4 py-3 rounded-xl transition-all">
                    <i class="fa-solid fa-gear w-6"></i> Configurações
                </a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-700/50">
            <button id="btn-logout" class="w-full text-slate-400 hover:text-red-400 hover:bg-red-900/20 flex items-center px-4 py-3 rounded-lg transition-all">
                <i class="fa-solid fa-arrow-right-from-bracket w-6"></i> Sair
            </button>
        </div>
    </aside>

    <!-- OVERLAY MOBILE (Fundo escuro ao abrir o menu) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-30 hidden md:hidden"></div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative pt-16 md:pt-0 w-full">
        <!-- Efeitos visuais mantidos -->
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600 rounded-full mix-blend-multiply filter blur-[100px] opacity-10 pointer-events-none"></div>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 relative z-10 w-full">
            
            <!-- SEÇÃO: DASHBOARD -->
            <section id="dashboard" class="page-section w-full animate-fade-in">
                <h2 class="text-2xl md:text-3xl font-bold text-white mb-6">Visão Geral</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 mb-8" id="dashboard-cards">
                    <div class="glass rounded-2xl p-6">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="text-slate-400 font-medium">Alunos</h3>
                            <i class="fa-solid fa-user-graduate text-emerald-400"></i>
                        </div>
                        <p class="text-3xl font-bold text-white" id="dash-total-alunos">0</p>
                    </div>
                    <div class="glass rounded-2xl p-6">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="text-slate-400 font-medium">Empréstimos</h3>
                            <i class="fa-solid fa-book text-purple-400"></i>
                        </div>
                        <p class="text-3xl font-bold text-white" id="dash-emprestimos-ativos">0</p>
                    </div>
                    <div class="glass rounded-2xl p-6 border border-red-900/30">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="text-slate-400 font-medium text-red-400">Atrasados</h3>
                            <i class="fa-solid fa-triangle-exclamation text-red-400"></i>
                        </div>
                        <p class="text-3xl font-bold text-red-400" id="dash-atrasos">0</p>
                    </div>
                </div>
            </section>

            <!-- SEÇÃO: ALUNOS -->
            <section id="alunos" class="page-section hidden w-full animate-fade-in">
                <h2 class="text-2xl md:text-3xl font-bold text-white mb-6">Gestão de Alunos</h2>
                <div class="glass rounded-2xl overflow-hidden w-full">
                    
                    <div class="flex overflow-x-auto border-b border-slate-700/50 bg-[#1E293B]/50 no-scrollbar">
                        <button class="tab-btn active whitespace-nowrap px-6 py-4 text-sm font-medium text-blue-400 border-b-2 border-blue-500 focus:outline-none" data-tab="lista-alunos">
                            <i class="fa-solid fa-list mr-2"></i> Alunos Cadastrados
                        </button>
                        <button class="tab-btn whitespace-nowrap px-6 py-4 text-sm font-medium text-slate-400 border-b-2 border-transparent hover:text-slate-200 focus:outline-none" data-tab="form-aluno">
                            <i class="fa-solid fa-user-plus mr-2"></i> Novo Cadastro
                        </button>
                    </div>

                    <div id="lista-alunos" class="tab-content p-4 md:p-6 block w-full">
                        <div class="w-full overflow-x-auto">
                            <table class="w-full text-left min-w-[600px] border-collapse">
                                <thead>
                                    <tr class="text-slate-400 border-b border-slate-700/50 text-sm">
                                        <th class="pb-3 font-medium">Matrícula</th>
                                        <th class="pb-3 font-medium">Nome Completo</th>
                                        <th class="pb-3 font-medium">Turma/Turno</th>
                                        <th class="pb-3 font-medium text-right">Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="tabela-alunos" class="text-sm">
                                    <!-- JS renderiza aqui -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div id="form-aluno" class="tab-content p-4 md:p-6 hidden w-full">
                        <form id="cadastro-aluno-form" class="space-y-4 md:space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm text-slate-400 mb-1">Matrícula *</label>
                                    <input type="text" id="aluno-matricula" required class="w-full h-12 bg-[#0F172A] border border-slate-700 rounded-lg px-4 text-white focus:border-blue-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-sm text-slate-400 mb-1">Nome Completo *</label>
                                    <input type="text" id="aluno-nome" required class="w-full h-12 bg-[#0F172A] border border-slate-700 rounded-lg px-4 text-white focus:border-blue-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-sm text-slate-400 mb-1">Série / Turma *</label>
                                    <input type="text" id="aluno-turma" required class="w-full h-12 bg-[#0F172A] border border-slate-700 rounded-lg px-4 text-white focus:border-blue-500 outline-none">
                                </div>
                                <div>
                                    <label class="block text-sm text-slate-400 mb-1">Turno *</label>
                                    <select id="aluno-turno" required class="w-full h-12 bg-[#0F172A] border border-slate-700 rounded-lg px-4 text-white focus:border-blue-500 outline-none">
                                        <option value="Manhã">Manhã</option>
                                        <option value="Tarde">Tarde</option>
                                        <option value="Noite">Noite</option>
                                        <option value="Integral">Integral</option>
                                    </select>
                                </div>
                            </div>
                            <div class="flex justify-end pt-4 border-t border-slate-700/50">
                                <button type="submit" class="w-full md:w-auto h-12 bg-blue-600 hover:bg-blue-700 text-white px-8 rounded-lg font-medium transition-all flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-save"></i> Salvar Aluno
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
            
            <!-- Outras seções continuam ocultas até serem implementadas com a mesma lógica -->
            <section id="emprestimos" class="page-section hidden w-full animate-fade-in"><h2 class="text-white text-2xl font-bold">Empréstimos</h2></section>
            <section id="configuracoes" class="page-section hidden w-full animate-fade-in"><h2 class="text-white text-2xl font-bold">Configurações</h2></section>

        </div>
    </main>
    <script type="module" src="js/app.js?v=4"></script>
</body>
</html>
