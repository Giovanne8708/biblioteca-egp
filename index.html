<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0F172A] font-poppins text-slate-200 overflow-hidden">
    
    <div id="mobile-overlay" class="fixed inset-0 bg-black/60 z-40 hidden md:hidden transition-opacity"></div>

    <div class="flex h-screen w-full">
        <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-[#1E293B] border-r border-slate-700 flex flex-col z-50 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300">
            <div class="h-20 flex items-center justify-between px-6 border-b border-slate-700">
                <div class="flex items-center">
                    <img src="logo.png" alt="EGP" class="h-10 w-auto object-contain mr-3">
                    <span class="text-lg font-bold text-white tracking-wide">Biblioteca</span>
                </div>
                <button id="btn-close-menu" class="md:hidden text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-2xl"></i>
                </button>
            </div>
            
            <nav class="flex-1 py-6 px-4 space-y-2 overflow-y-auto">
                <a href="#" data-view="dashboard" class="nav-item active flex items-center px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-700/50 rounded-xl transition-all">
                    <i class="fa-solid fa-chart-pie w-6"></i> Dashboard
                </a>
                <a href="#" data-view="alunos" class="nav-item flex items-center px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-700/50 rounded-xl transition-all">
                    <i class="fa-solid fa-users w-6"></i> Alunos
                </a>
            </nav>

            <div class="p-4 border-t border-slate-700">
                <a href="login.html" class="flex items-center px-4 py-2 text-slate-400 hover:text-[#EF4444] transition-colors">
                    <i class="fa-solid fa-arrow-right-from-bracket w-6"></i> Sair
                </a>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-screen overflow-hidden bg-[#0F172A] w-full relative">
            <header class="md:hidden flex items-center justify-between bg-[#1E293B] p-4 border-b border-slate-700">
                <div class="flex items-center">
                    <img src="logo.png" alt="Logo" class="h-8 object-contain mr-2">
                    <span class="font-bold text-white">Biblioteca EGP</span>
                </div>
                <button id="btn-open-menu" class="text-slate-300 hover:text-white">
                    <i class="fa-solid fa-bars text-2xl"></i>
                </button>
            </header>

            <div class="flex-1 overflow-y-auto p-4 md:p-8 w-full">
                <section id="view-dashboard" class="view-section">
                    <h2 class="text-xl md:text-2xl font-bold text-white mb-6">Visão Geral</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                        <div class="bg-[#1E293B] p-5 rounded-2xl border border-slate-700 shadow-lg">
                            <p class="text-xs md:text-sm text-slate-400">Total de Livros</p>
                            <h3 class="text-2xl md:text-3xl font-bold text-white mt-1" id="dash-total-livros">0</h3>
                        </div>
                        <div class="bg-[#1E293B] p-5 rounded-2xl border border-slate-700 shadow-lg">
                            <p class="text-xs md:text-sm text-slate-400">Alunos Ativos</p>
                            <h3 class="text-2xl md:text-3xl font-bold text-white mt-1" id="dash-total-alunos">0</h3>
                        </div>
                    </div>
                </section>

                <section id="view-alunos" class="view-section hidden">
                    <h2 class="text-xl md:text-2xl font-bold text-white mb-6">Gerenciamento de Alunos</h2>
                    <p class="text-slate-400">Módulo em construção...</p>
                </section>
            </div>
        </main>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
