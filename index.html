<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Biblioteca EGP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#0F172A] text-slate-200 h-screen overflow-hidden font-sans flex">

    <!-- OVERLAY MOBILE -->
    <div id="mobile-overlay" class="fixed inset-0 bg-black/60 z-40 hidden lg:hidden backdrop-blur-sm transition-opacity"></div>

    <!-- MENU LATERAL -->
    <aside id="sidebar" class="glass fixed lg:relative inset-y-0 left-0 w-64 border-r border-slate-700/50 flex flex-col z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
        <div class="h-20 flex items-center justify-between px-6 border-b border-slate-700/50">
            <img src="assets/logo.png" alt="EGP" class="h-10 object-contain">
            <button id="btn-close-menu" class="lg:hidden text-slate-400 hover:text-white transition-colors">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        
        <nav class="flex-1 py-6 px-4 space-y-2 overflow-y-auto">
            <a href="#" data-target="dashboard" class="nav-link bg-blue-600/20 text-blue-400 border-r-4 border-blue-500 flex items-center px-4 py-3 rounded-l-xl transition-all">
                <i class="fa-solid fa-chart-pie w-6"></i> Dashboard
            </a>
            <a href="#" data-target="alunos" class="nav-link text-slate-400 hover:bg-slate-800/50 hover:text-white flex items-center px-4 py-3 rounded-l-xl transition-all">
                <i class="fa-solid fa-user-graduate w-6"></i> Alunos
            </a>
            <a href="#" data-target="livros" class="nav-link text-slate-400 hover:bg-slate-800/50 hover:text-white flex items-center px-4 py-3 rounded-l-xl transition-all">
                <i class="fa-solid fa-book w-6"></i> Livros
            </a>
            <a href="#" data-target="emprestimos" class="nav-link text-slate-400 hover:bg-slate-800/50 hover:text-white flex items-center px-4 py-3 rounded-l-xl transition-all">
                <i class="fa-solid fa-hand-holding-hand w-6"></i> Empréstimos
            </a>
        </nav>

        <div class="p-4 border-t border-slate-700/50">
            <button id="btn-logout" class="w-full flex items-center justify-center px-4 py-2 text-slate-400 hover:bg-red-500/10 hover:text-red-400 rounded-lg transition-colors">
                <i class="fa-solid fa-arrow-right-from-bracket mr-2"></i> Sair do Sistema
            </button>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        
        <!-- CABEÇALHO MOBILE -->
        <header class="lg:hidden glass flex items-center justify-between p-4 border-b border-slate-700/50 z-30">
            <div class="flex items-center gap-3">
                <button id="btn-open-menu" class="text-slate-300 hover:text-white transition-colors">
                    <i class="fa-solid fa-bars text-2xl"></i>
                </button>
                <span class="font-bold text-white tracking-wide">Biblioteca EGP</span>
            </div>
        </header>

        <!-- CONTÊINER DAS TELAS -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8 w-full max-w-7xl mx-auto scroll-smooth">
            
            <!-- VIEW: DASHBOARD -->
            <section id="view-dashboard" class="view-section">
                <!-- O conteúdo será injetado pelo dashboard.js -->
                <div class="animate-pulse bg-slate-800 h-8 w-48 rounded mb-6"></div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div class="bg-slate-800 h-32 rounded-2xl animate-pulse"></div>
                    <div class="bg-slate-800 h-32 rounded-2xl animate-pulse"></div>
                    <div class="bg-slate-800 h-32 rounded-2xl animate-pulse"></div>
                    <div class="bg-slate-800 h-32 rounded-2xl animate-pulse"></div>
                </div>
            </section>

            <!-- VIEW: ALUNOS -->
            <section id="view-alunos" class="view-section hidden">
                <!-- O conteúdo será montado pelo alunos.js -->
            </section>

            <!-- VIEW: LIVROS -->
            <section id="view-livros" class="view-section hidden">
                <!-- O conteúdo será montado pelo livros.js -->
            </section>

            <!-- VIEW: EMPRÉSTIMOS -->
            <section id="view-emprestimos" class="view-section hidden">
                <!-- O conteúdo será montado pelo emprestimos.js -->
            </section>

        </div>
    </main>

    <!-- Script Principal (Módulo ES6) -->
    <script type="module" src="js/app.js"></script>
    
    <!-- Lógica simples do menu responsivo -->
    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('mobile-overlay');
        const toggleMenu = () => {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        };
        document.getElementById('btn-open-menu')?.addEventListener('click', toggleMenu);
        document.getElementById('btn-close-menu')?.addEventListener('click', toggleMenu);
        overlay?.addEventListener('click', toggleMenu);
        // Fecha o menu ao clicar em um link no mobile
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                if(window.innerWidth < 1024) toggleMenu();
            });
        });
    </script>
</body>
</html>
